spring.application.name=YouRoster
spring.config.import=file:env.properties
#SERVER CONFIG
server.port=${PORT}
#DB CONFIG
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
#HIBERNATE
spring.jpa.hibernate.ddl-auto=update
#JWT
jwt.secret=${JWT_SECRET}
#CLOUDINARY
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.secret=${CLOUDINARY_SECRET}
#PASSWORD ADMIN
password.admin=${PASSWORD_ADMIN}
email.admin=${EMAIL_ADMIN}
#EMAIL SENDER
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APIKEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
email.from=${EMAIL_FROM}
#LINK LOGIN NELL'EMAIL INVIATA A REGISTRAZIONE ACCETTATA
login.url=${EMAIL_BTN_LOGIN}
#LINK EMAIL A HR, PRS, ADMIN PER PROFILO AGGIORNATO
profileUpdated.url=${EMAIL_UPDATED_PROFILE}
roleUpdated.url=${EMAIL_UPDATED_ROLE}
shiftUpdated.url=${SHIFT_UPDATED}
addedTask.url=${ADDED_TASK}
newHolidayRequest.url=${NEW_HOLIDAY_REQUEST}
response.url=${RESPONSE}
newLeaveHoursRequest.url=${NEW_LEAVE_HOURS_REQUEST}
newChangeHolidayRequest.url=${NEW_CHANGE_HOLIDAY_REQUEST_URL}
newChangeLeaveHoursRequest.url=${NEW_CHANGE_LEAVE_HOURS_REQUEST_URL}
newCertificationRequest.url=${NEW_CERTIFICATION_REQUEST}
resetPasswordToken.url=${RESET_PASSWORD_TOKEN}
